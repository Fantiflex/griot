# LeGriot — pile complète sur une seule machine (serveur d'établissement ou PC enseignant).
#   docker compose up -d
#   docker compose exec ollama ollama pull gemma3:4b     (une fois)
# Puis ouvrir http://<ip-du-serveur>:3000
#
# Pour un GPU avec le modèle fine-tuné : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  web:
    build: .
    image: legriot/web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-gemma3:4b}
      TTS_URL: http://tts:5002
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
    volumes:
      - legriot-data:/data
    depends_on:
      - ollama
      - tts

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    # Décommenter pour un GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  tts:
    build: ./services/tts
    image: legriot/tts:latest
    restart: unless-stopped
    volumes:
      - piper-voices:/voices

volumes:
  legriot-data:
  ollama-models:
  piper-voices:
